<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Staff Storage Management</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="container">
        <h1>Staff Storage Management</h1>

        <section>
            <h3>Add Storage Unit</h3>
            <form id="createForm">
                <label for="name">Name</label>
                <input type="text" id="name" required />

                <label for="location">Location</label>
                <input type="text" id="location" required />

                <label for="capacity">Capacity</label>
                <input type="number" id="capacity" min="0" />

                <label for="description">Description</label>
                <input type="text" id="description" />

                <button type="submit">Create</button>
            </form>
        </section>

        <section>
            <h3>Available Storage Units</h3>
            <button id="refresh">Refresh List</button>
            <pre id="listOutput"></pre>
        </section>

        <section>
            <h3>Update/Delete Unit</h3>
            <form id="modifyForm">
                <label for="unitId">Unit ID</label>
                <input type="text" id="unitId" required />

                <label for="editName">Name</label>
                <input type="text" id="editName" />

                <label for="editLocation">Location</label>
                <input type="text" id="editLocation" />

                <label for="editCapacity">Capacity</label>
                <input type="number" id="editCapacity" min="0" />

                <label for="editDescription">Description</label>
                <input type="text" id="editDescription" />

                <button id="updateBtn" type="button">Update</button>
                <button id="deleteBtn" type="button">Delete</button>
            </form>
        </section>

        <button id="logout">Logout</button>

        <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.8/dist/amazon-cognito-identity.min.js"></script>
        <script src="js/admin.js"></script>
    </div>
</body>
</html>
