<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Simple Storage — Self-storage for the digital age</title>
    <link rel="stylesheet" href="css/dashboard.css" />
    <style>
        .landing {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }
        .landing__content {
            max-width: 600px;
        }
        .landing h1 {
            font-size: 3rem;
            margin: 0 0 16px;
        }
        .landing p {
            font-size: 1.2rem;
            color: var(--muted);
            margin: 0 0 32px;
        }
        .landing__actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>
    <div class="landing">
        <div class="landing__content">
            <div class="brand" style="justify-content: center; margin-bottom: 24px;">
                <div class="logo" aria-hidden="true">SS</div>
                <div>
                    <div class="brand__title">Simple Storage</div>
                    <div class="brand__tag">Flexible. Secure. Seamless.</div>
                </div>
            </div>

            <h1>Self-storage for the digital age</h1>
            <p>
                Browse facilities, book storage units, manage access, and track your rentals—all in one place.
                Powered by AWS Lambda, DynamoDB, and Cognito.
            </p>

            <div class="landing__actions">
                <button id="btnGetStarted" class="btn btn-primary">Get Started</button>
                <a href="dashboard.html" class="btn btn-secondary">Go to Dashboard</a>
            </div>

            <div class="meta" style="justify-content: center; margin-top: 32px;">
                <div class="pill">App unlock</div>
                <div class="pill">Share access</div>
                <div class="pill">Secure payments</div>
                <div class="pill">Cancel with notice</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { CognitoAuth } from './js/cognito-auth.js';

        document.getElementById('btnGetStarted').addEventListener('click', () => {
            // Check if already authenticated
            if (CognitoAuth.isAuthenticated()) {
                window.location.href = 'dashboard.html';
            } else {
                // Redirect to Cognito login
                CognitoAuth.login();
            }
        });
    </script>
</body>
</html>
