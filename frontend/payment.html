<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Payment</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="container">
        <h1>Payment</h1>
        <form id="paymentForm">
            <label for="amount">Amount</label>
            <input type="number" id="amount" min="0.01" step="0.01" required />
            <label for="unitId">Unit ID (optional)</label>
            <input type="text" id="unitId" />
            <label for="cardName">Cardholder Name</label>
            <input type="text" id="cardName" required />
            <label for="cardNumber">Card Number</label>
            <input type="text" id="cardNumber" inputmode="numeric" autocomplete="cc-number" required />
            <label for="expiry">Expiry (MM/YY)</label>
            <input type="text" id="expiry" placeholder="MM/YY" required />
            <label for="cvv">CVV</label>
            <input type="text" id="cvv" inputmode="numeric" required />
            <button type="submit">Pay Now</button>
        </form>
        <pre id="paymentResult"></pre>
        <button onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
        <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.8/dist/amazon-cognito-identity.min.js"></script>
        <script src="js/payment.js"></script>
    </div>
</body>
</html>
