stages:
  - bootstrap
  - build
  - deploy

variables:
  AWS_DEFAULT_REGION: af-south-1
  BOOTSTRAP_STACK_NAME: capstone-bootstrap
  STACK_NAME: capstone-stack

bootstrap_infra:
  stage: bootstrap
  image: amazon/aws-cli:latest
  script:
    - |
      # Check if bootstrap stack exists
      if aws cloudformation describe-stacks --stack-name "$BOOTSTRAP_STACK_NAME" 2>/dev/null; then
        echo "Bootstrap stack exists, checking for updates..."
        aws cloudformation update-stack \
          --stack-name "$BOOTSTRAP_STACK_NAME" \
          --template-body file://backend/bootstrap-template.yaml \
          --capabilities CAPABILITY_IAM 2>/dev/null || echo "No updates needed or stack is up to date"
        aws cloudformation wait stack-update-complete --stack-name "$BOOTSTRAP_STACK_NAME" 2>/dev/null || true
      else
        echo "Creating bootstrap stack..."
        aws cloudformation create-stack \
          --stack-name "$BOOTSTRAP_STACK_NAME" \
          --template-body file://backend/bootstrap-template.yaml \
          --capabilities CAPABILITY_IAM
        echo "Waiting for stack creation to complete..."
        aws cloudformation wait stack-create-complete --stack-name "$BOOTSTRAP_STACK_NAME"
      fi
    - |
      # Export bucket name for other stages
      S3_BUCKET=$(aws cloudformation describe-stacks \
        --stack-name "$BOOTSTRAP_STACK_NAME" \
        --query "Stacks[0].Outputs[?OutputKey=='DeploymentBucketName'].OutputValue" \
        --output text)
      echo "Deployment bucket: $S3_BUCKET"
      echo "S3_BUCKET=$S3_BUCKET" >> build.env
  artifacts:
    reports:
      dotenv: build.env
  only:
    - main
    - master
    - production

build_lambda:
  stage: build
  image: python:3.12
  needs:
    - job: bootstrap_infra
      artifacts: true
  before_script:
    - pip install --upgrade pip
    - pip install aws-sam-cli
  script:
    - cd backend
    - sam build
  artifacts:
    paths:
      - backend/.aws-sam/
    expire_in: 1 hour
  only:
    - main
    - master
    - production

deploy_lambda:
  stage: deploy
  image: python:3.12
  needs:
    - job: bootstrap_infra
      artifacts: true
    - job: build_lambda
      artifacts: true
  before_script:
    - pip install awscli
  script:
    - echo "Using deployment bucket: $S3_BUCKET"
    - cd backend
    - aws cloudformation package --template-file .aws-sam/build/template.yaml --s3-bucket "$S3_BUCKET" --output-template-file packaged.yaml
    - aws cloudformation deploy --template-file packaged.yaml --stack-name "$STACK_NAME" --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset
  only:
    - main
    - master
    - production
